# NEU Course Assistant Configuration

# OpenAI API Key (replace with your actual API key)
openai.api.key=your_openai_api_key_here

# Web Server Configuration
server.port=8080
server.static.path=src/main/resources/static

# LLM Configuration
llm.model=gpt-4
llm.temperature=0.7
llm.max_tokens=2000

# RAG Configuration
rag.max_results=10
rag.embedding_model=text-embedding-ada-002

# Conversation Configuration
conversation.max_history=20

# Akka Configuration
akka.loglevel=INFO

# Debug Mode (true/false)
debug=false